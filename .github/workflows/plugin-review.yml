name: CARE Plugin Review

# Reusable reviewer for the CARE plugin fleet.
#
# Mechanism lives here (public, so public callers can reference it); judgment lives in a
# private rules repo named by the org variable CARE_RULES_REPO and checked out at run time.
# A rule change is a commit there and needs no tag move here.
#
# Advisory by design: this workflow must never block a merge. See `continue-on-error` below.

on:
  workflow_call:
    inputs:
      layer:
        description: 'Which rule set to load: "backend" or "frontend".'
        required: true
        type: string
      max_diff_lines:
        description: 'Skip the review above this many changed lines.'
        required: false
        type: number
        default: 2000
      model:
        description: >-
          Model for the review. Defaults to the org variable CARE_REVIEW_MODEL so the whole
          fleet can be moved between models by editing one variable, with no commit here and
          no change in any caller. Falls back to Haiku if the variable is unset.
        required: false
        type: string
        default: ''
      rules_repo:
        description: >-
          owner/repo holding the review rules. Defaults to the org variable CARE_RULES_REPO,
          resolved at run time rather than here — a workflow_call input default cannot read
          the vars context, and this repo is public, so the private rules repo should not be
          named in it.
        required: false
        type: string
        default: ''
      reports_ref:
        description: >-
          Branch in the rules repo that reports are appended to. Deliberately NOT the branch
          the rules live on: the reports token can write, so protect the rules branches and
          let that token reach only this one.
        required: false
        type: string
        default: reports
      rules_ref:
        description: >-
          Which ref of the rules repo to read. Defaults to `dev` during the pilot, because
          that is where the rules currently live and the rules repo's own default branch is
          still empty. Flip this default to `main` once the rules are merged there.
        required: false
        type: string
        default: dev
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      CARE_REVIEWER_TOKEN:
        required: true
      CARE_REPORTS_TOKEN:
        description: Write-scoped PAT for the reports branch. Omit it and reporting is skipped.
        required: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write        # required for the action's default GitHub App authentication
    steps:
      - name: Validate layer input
        run: |
          case "${{ inputs.layer }}" in
            backend|frontend) ;;
            *) echo "::error::layer must be 'backend' or 'frontend', got '${{ inputs.layer }}'"; exit 1 ;;
          esac

      # Full history: the size gate and the review both diff base...head locally, so we never
      # need a GitHub API call (or a token) just to read the diff.
      - name: Check out the plugin repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve the rules source
        id: src
        env:
          FROM_INPUT: ${{ inputs.rules_repo }}
          FROM_VAR: ${{ vars.CARE_RULES_REPO }}
        run: |
          # Not echoed: Actions variables are not masked, and these logs are public.
          REPO="${FROM_INPUT:-$FROM_VAR}"
          if [ -z "$REPO" ]; then
            echo "::error::No rules repo. Set the org Actions variable CARE_RULES_REPO (owner/repo), or pass rules_repo:."
          fi
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"

      # continue-on-error so an expired CARE_REVIEWER_TOKEN, or an unset CARE_RULES_REPO,
      # annotates and skips instead of turning the PR's checks red. The guard below then
      # finds no rules and skips the review, leaving the job green.
      - name: Check out the review rules
        if: steps.src.outputs.repo != ''
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.src.outputs.repo }}
          ref: ${{ inputs.rules_ref }}
          path: .care-rules
          token: ${{ secrets.CARE_REVIEWER_TOKEN }}
          persist-credentials: false

      # A misconfigured reviewer must still not block a merge, so this annotates loudly and
      # skips the review rather than failing the job. A silent no-op would be worse than both.
      - name: Verify the rules are present
        id: rules
        run: |
          MISSING=
          for f in rules/REVIEW.md "rules/${{ inputs.layer }}-plugin.md"; do
            [ -s ".care-rules/$f" ] || MISSING="$MISSING $f"
          done
          if [ -n "$MISSING" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::No review possible: missing or empty on the rules repo at ref '${{ inputs.rules_ref }}':$MISSING"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Rules loaded at ref '${{ inputs.rules_ref }}'."
          fi

      - name: Size gate
        id: size
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MAX: ${{ inputs.max_diff_lines }}
        run: |
          CHANGED=$(git diff --numstat "$BASE_SHA...$HEAD_SHA" \
            | awk '{ a += ($1 == "-" ? 0 : $1); d += ($2 == "-" ? 0 : $2) } END { print a + d + 0 }')
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          if [ "$CHANGED" -gt "$MAX" ]; then
            echo "too_big=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping review: $CHANGED changed lines exceeds the limit of $MAX."
          else
            echo "too_big=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Reviewing $CHANGED changed lines."
          fi

      - name: Review
        if: steps.rules.outputs.ok == 'true' && steps.size.outputs.too_big != 'true'
        # Advisory: a failed or errored review must never turn the PR's checks red.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # track_progress creates the PR comment that the summary lands in. Without it the
          # action posts nothing and Claude's final message is discarded — the review runs,
          # costs money, and vanishes. use_sticky_comment then keeps it to one comment that
          # updates on each push instead of a new one every time.
          track_progress: true
          use_sticky_comment: true
          # NOT enabling show_full_output: these logs are public and the rules repo is private.
          claude_args: >-
            --model ${{ inputs.model || vars.CARE_REVIEW_MODEL || 'claude-haiku-4-5' }}
            --max-turns 30
            --allowedTools "Read,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(git show:*),mcp__github_inline_comment__create_inline_comment"
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in
            ${{ github.repository }}.

            Read these three files first, in this order, and follow them exactly:

            1. `.care-rules/rules/REVIEW.md` — the review contract: lenses, severity tiers,
               the NEVER-rules, and the required output format.
            2. `.care-rules/rules/${{ inputs.layer }}-plugin.md` — the rules for this layer.
            3. `CLAUDE.md` in the repository root, if present — this plugin's identity, entry
               points, integrations and deliberate deviations. A deviation documented there is
               not a finding. If it is missing, say so once in the summary and review anyway.

            The diff under review is:

                git diff ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}

            The working tree is the PR's head, so you can read any file at its post-change state
            and check other callers of anything this diff touches. Verify every claim against the
            actual tree before making it.

            How to report, which matters as much as what you find:

            - Every finding MUST be posted with the
              `mcp__github_inline_comment__create_inline_comment` tool, on the line it concerns.
              This is the only way a finding reaches a human. Text you write in your reply is
              discarded, so a review written as prose and never posted through the tool is the
              same as no review at all.
            - Your final message becomes the PR summary comment. Write it in the summary format
              REVIEW.md specifies, and keep it short.
            - Remember proportionality: if the diff is genuinely fine, call the tool zero times
              and say so in one line.

      # Reporting is best-effort: no token, no report, and never a failed review.
      # Reporting is best-effort: no token, no report, and never a failed review.
      # Runs under `bash -e`, so every fallible command carries its own guard.
      - name: Report
        if: steps.rules.outputs.ok == 'true' && steps.size.outputs.too_big != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPORTS_TOKEN: ${{ secrets.CARE_REPORTS_TOKEN }}
          RULES_REPO: ${{ steps.src.outputs.repo }}
          BRANCH: ${{ inputs.reports_ref }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LAYER: ${{ inputs.layer }}
          CHANGED: ${{ steps.size.outputs.changed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The secrets context is unavailable in `if:`, so the guard lives here.
          if [ -z "$REPORTS_TOKEN" ]; then
            echo "::notice::CARE_REPORTS_TOKEN not set; skipping the review report."
            exit 0
          fi

          DEST=$(python3 .care-rules/scripts/build_report.py) || {
            echo "::warning::Could not build the review report."; exit 0; }

          REMOTE="https://x-access-token:${REPORTS_TOKEN}@github.com/${RULES_REPO}.git"

          # Distinguish the two failure modes explicitly: a token that cannot READ the rules
          # repo and one that can read but not WRITE produce the same opaque 403 otherwise.
          if ! git ls-remote "$REMOTE" >/dev/null 2>&1; then
            echo "::warning::CARE_REPORTS_TOKEN cannot read ${RULES_REPO}. Check that the \
          fine-grained PAT names the ORGANISATION as its resource owner, lists that repository, \
          grants Contents: Read and write, and has been approved if the org requires approval."
            exit 0
          fi

          if git clone -q --depth 1 --branch "$BRANCH" "$REMOTE" _reports 2>/dev/null; then
            :
          else
            git clone -q --depth 1 "$REMOTE" _reports 2>/dev/null || {
              echo "::warning::Could not clone ${RULES_REPO}."; exit 0; }
            git -C _reports checkout -q --orphan "$BRANCH" || { echo "::warning::orphan failed"; exit 0; }
            git -C _reports rm -rqf . 2>/dev/null || true
          fi

          mkdir -p "_reports/$(dirname "$DEST")"
          cp _report/body.md "_reports/$DEST"
          cd _reports
          git config user.name  'care-ci[bot]'
          git config user.email 'care-ci@users.noreply.github.com'
          git add -- "$DEST"
          git commit -qm "report: ${REPO}#${PR}" || { echo "::notice::Nothing to report."; exit 0; }

          # Repos are reviewed concurrently; rebase and retry rather than lose the report.
          for _ in 1 2 3 4 5; do
            PUSH_ERR=$(git push origin "HEAD:$BRANCH" 2>&1) && {
              echo "::notice::Report published to ${BRANCH}: ${DEST}"; exit 0; }
            case "$PUSH_ERR" in
              *"not granted"*|*403*)
                echo "::warning::CARE_REPORTS_TOKEN can read ${RULES_REPO} but cannot write to \
          it. Set Contents: Read and write on the fine-grained PAT."
                exit 0 ;;
            esac
            git fetch -q origin "$BRANCH" 2>/dev/null || break
            git rebase -q "origin/$BRANCH" 2>/dev/null || break
            sleep $(( (RANDOM % 5) + 2 ))
          done
          echo "::warning::Could not publish the review report: ${PUSH_ERR}"

      - name: Note skipped review
        if: steps.size.outputs.too_big == 'true'
        run: echo "Review skipped (${{ steps.size.outputs.changed }} changed lines). Job is green by design."
